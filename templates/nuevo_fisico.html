{% extends "base.html" %}
{% block content %}
    <h2>📦 Nuevo Producto Físico</h2>
    <form method="POST">
        <div class="mb-3"><label>Código</label><input type="text" name="codigo" class="form-control" required></div>
        <div class="mb-3"><label>Nombre</label><input type="text" name="nombre" class="form-control" required></div>
        <div class="row">
            <div class="col"><label>Precio</label><input type="number" step="0.01" name="precio_base" class="form-control" required></div>
            <div class="col"><label>Stock</label><input type="number" name="stock" class="form-control" required></div>
        </div>
        <div class="row mt-2">
            <div class="col"><label>Peso (kg)</label><input type="number" step="0.01" name="peso_kg" class="form-control" required></div>
            <div class="col"><label>Envío por kg</label><input type="number" step="0.01" name="costo_envio_por_kg" class="form-control" required></div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Crear</button>
    </form>
{% endblock %}
