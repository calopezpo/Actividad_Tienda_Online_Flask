{% extends "base.html" %}
{% block content %}
    <h2>✏️ Editar Producto</h2>
    <form method="POST">
        <div class="mb-3"><label>Nombre</label><input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required></div>
        <div class="mb-3"><label>Precio</label><input type="number" step="0.01" name="precio_base" class="form-control" value="{{ producto.precio_base }}" required></div>
        <div class="mb-3"><label>Stock</label><input type="number" name="stock" class="form-control" value="{{ producto.stock }}" required></div>
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
    </form>
{% endblock %}
